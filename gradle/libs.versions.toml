[versions]
# Toolchain
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"

# AndroidX (core: la última que acepta minSdk 21; las nuevas exigen 23)
coreKtx = "1.16.0"
appcompat = "1.7.1"
activity = "1.13.0"
lifecycle = "2.6.2" # 2.11.0 trae lifecycle-runtime-ktx-android con minSdk 23 (bump androidx 30-jul-2025) — viola la política minSdk-21; 2.6.2 es la última previa al bump. Room 2.7.2 no exige lifecycle ≥ 2.7.
room = "2.7.2"
# paging 3.3.6 = última minSdk-21: androidx subió el minSdk default a 23 el 30-jul-2025
# (3.4.0+ exige 23; ruling igual que Room 2.7.2/coil 2/okhttp 4). room-paging 2.7.2 usa paging 3.3.2 → grafo coherente.
paging = "3.3.6"
workmanager = "2.9.0" # 2.12.0 declara minSdk 24; 2.9.x es la última serie con minSdk 23 (ruling minSdk23 en vigor)
securityCrypto = "1.1.0"

# Media / net / images
media3 = "1.11.1"
# okhttp 4: la 5 exige compileSdk 37 (ruling ledger); 4.12.0 es minSdk-21
okhttp = "4.12.0"
# coil 2.7.0: coil-3 exige minSdk 23 (ruling minSdk21); okHttpClient() first-class p/ lograr el gate
coil = "2.7.0"

# Test
junit = "4.13.2"
robolectric = "4.17"
kotlinCoroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
"media3_exoplayer" = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
"media3_exoplayer_hls" = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
"media3_exoplayer_dash" = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
"media3_exoplayer_smoothstreaming" = { group = "androidx.media3", name = "media3-exoplayer-smoothstreaming", version.ref = "media3" }
"media3_datasource_okhttp" = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlin-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinCoroutinesTest" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
